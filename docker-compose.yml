services:
  postgres:
    image: postgres:16
    container_name: gbfs_postgres
    restart: always
    environment:
      POSTGRES_USER: gbfs_user
      POSTGRES_PASSWORD: gbfs_password
      POSTGRES_DB: gbfs_dashboard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  next-app:
    build: .
    container_name: gbfs_next
    restart: always
    ports:
      - "80:3000"
    environment:
      DATABASE_URL: postgresql://gbfs_user:gbfs_password@postgres:5432/gbfs_dashboard
    volumes:
      - ./exports:/app/exports
    depends_on:
      - postgres

  collector:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: gbfs_collector
    restart: always
    command: npx tsx scripts/collector.ts
    environment:
      API_BASE_URL: http://next-app:3000
    depends_on:
      - next-app

  export-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: gbfs_export_worker
    restart: always
    command: npx tsx scripts/export-worker.ts
    environment:
      DATABASE_URL: postgresql://gbfs_user:gbfs_password@postgres:5432/gbfs_dashboard
    volumes:
      - ./exports:/app/exports
    depends_on:
      - postgres

volumes:
  postgres_data: